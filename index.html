<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12110f" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Defaults for crawlers that don't run JavaScript. main.jsx removes them once React renders per-page tags. -->
    <title data-default-meta>AZ Listing Media | Real Estate Photography &amp; Video in Phoenix</title>
    <meta data-default-meta name="description" content="Real estate photography, cinematic video, aerial drone media, twilight and floor plans for agents and builders across the greater Phoenix area. Book online." />
    <meta data-default-meta property="og:title" content="AZ Listing Media | Real Estate Photography &amp; Video in Phoenix" />
    <meta data-default-meta property="og:description" content="Photography, video, aerial and floor plans for agents and builders across the Valley." />
    <meta data-default-meta property="og:url" content="https://azlistingmedia.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AZ Listing Media" />
    <meta property="og:image" content="https://azlistingmedia.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "AZ Listing Media",
        "legalName": "Eighteen Percent Productions LLC",
        "url": "https://azlistingmedia.com/",
        "image": "https://azlistingmedia.com/og-image.jpg",
        "logo": "https://azlistingmedia.com/img/logo-black.png",
        "telephone": "+1-623-252-0066",
        "email": "info@azlistingmedia.com",
        "areaServed": {"@type": "Place", "name": "Greater Phoenix, Arizona"},
        "address": {"@type": "PostalAddress", "addressLocality": "Phoenix", "addressRegion": "AZ", "addressCountry": "US"},
        "openingHoursSpecification": [
          {"@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "10:00", "closes": "17:00"}
        ],
        "priceRange": "$$",
        "sameAs": ["https://www.instagram.com/azlistingmedia", "https://www.facebook.com/azlistingmedia"]
      }
    </script>
  </head>

  <body>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif">
        AZ Listing Media: real estate photography, video and aerial media in Phoenix.
        Call <a href="tel:+16232520066">623-252-0066</a> or email
        <a href="mailto:info@azlistingmedia.com">info@azlistingmedia.com</a>.
      </p>
    </noscript>

    <!-- Netlify Forms detection. Keep field names in sync with src/components/ContactForm.jsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <select name="service"></select>
      <input name="address" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
